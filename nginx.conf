server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip básico
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API e exportações → backend Express
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_cookie_path / /;
    }

    # Rotas amigáveis → arquivos HTML
    location = /login   { try_files /login.html =404; }
    location = /obrigado { try_files /obrigado.html =404; }
    location = /loja    { try_files /loja.html =404; }
    location = /bi      { try_files /bi.html =404; }
    location = /qrcode  { try_files /qrcode.html =404; }

    # Estáticos (css, js, img, html)
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
