<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Obrigado! · Cred Móveis Itabaiana</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23b0824c'/%3E%3Ctext x='50' y='68' font-size='54' text-anchor='middle' fill='%23fbf7ef' font-family='Georgia,serif' font-weight='700'%3EC%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .obrigado-card { text-align: center; padding: 46px 30px; }
    .selo {
      width: 92px; height: 92px; margin: 0 auto 22px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--verde), #5b7a48);
      display: grid; place-items: center;
      box-shadow: 0 12px 28px -10px rgba(111, 143, 87, 0.7);
      animation: aparecer 0.5s cubic-bezier(0.2, 1.2, 0.4, 1);
    }
    .selo svg { width: 46px; height: 46px; }
    @keyframes aparecer { from { transform: scale(0.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .obrigado-card h1 { font-size: 28px; }
    .obrigado-card p { font-size: 15.5px; max-width: 380px; margin: 0 auto 8px; }
  </style>
</head>
<body>
  <main class="container">
    <header class="marca" style="justify-content:center">
      <img class="marca-logo" src="img/logo.png" alt="Cred Móveis" />
      <div>
        <div class="marca-nome">Cred Móveis</div>
        <div class="marca-sub">Itabaiana</div>
      </div>
    </header>

    <div class="card obrigado-card">
      <div class="selo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fbf7ef" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6 9 17l-5-5" />
        </svg>
      </div>
      <h1>Avaliação enviada!</h1>
      <p>Muito obrigado por dedicar seu tempo. 💛</p>
      <p>Sua opinião chega direto à nossa equipe e nos ajuda a cuidar cada vez melhor de você e da sua casa.</p>
      <div style="margin-top:26px">
        <a href="index.html" class="btn btn-secundario btn-sm">Enviar outra avaliação</a>
      </div>
    </div>

    <p class="rodape">Cred Móveis Itabaiana · Móveis que fazem do seu lar um lugar melhor</p>
  </main>
</body>
</html>
